[package]
name = "wrapper"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "wrapper"
path = "src/rust/main.rs"

[dependencies]
httparse = "1.10"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
tar = "0.4"
flate2 = "1.0"
base64 = "0.22"

services:
  wrapper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_PLATFORM: ${BUILD_PLATFORM:-linux/amd64}
        # Prebuilt immutable base carrying the staged rootfs; see Dockerfile.base.
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/5hojib/wrapper-on-paas/wrapper-base:latest}
    image: wrapper-v2:latest
    container_name: wrapper-v2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${DECRYPT_PORT:-10020}:10020"
    environment:
      WRAPPER_HOST: ${WRAPPER_HOST:-}
      WRAPPER_PORT: ${WRAPPER_PORT:-}
      WRAPPER_DECRYPT_HOST: ${WRAPPER_DECRYPT_HOST:-}
      WRAPPER_DECRYPT_PORT: ${WRAPPER_DECRYPT_PORT:-}
      WRAPPER_WORKER_TIMEOUT_SECS: ${WRAPPER_WORKER_TIMEOUT_SECS:-}
      WRAPPER_BASE_DIR: ${WRAPPER_BASE_DIR:-}
      WRAPPER_LIBS_DIR: ${WRAPPER_LIBS_DIR:-}
      WRAPPER_DEVICE_INFO: ${WRAPPER_DEVICE_INFO:-}
      WRAPPER_RESTORE_SESSION: ${WRAPPER_RESTORE_SESSION:-}
      WRAPPER_APPLE_ID: ${WRAPPER_APPLE_ID:-}
      WRAPPER_USERNAME: ${WRAPPER_USERNAME:-}
      WRAPPER_PASSWORD: ${WRAPPER_PASSWORD:-}
      WRAPPER_APPLE_INIT: ${WRAPPER_APPLE_INIT:-}
      WRAPPER_API_KEY: ${WRAPPER_API_KEY:-}
    volumes:
      # Persist Apple state at the same path shape as the Android app sandbox
      # (rootless layout: /data lives at the image root).
      - ./data:/data/data/com.apple.android.music/files
